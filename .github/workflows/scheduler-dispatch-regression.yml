name: Scheduler dispatch regression

on:
  pull_request:
    paths:
      - "org_agent_mesh/internal_scheduler.py"
      - "org_agent_mesh/launch_admission.py"
      - "org_agent_mesh/scheduler_reconciliation.py"
      - "org_agent_mesh/schedule_activation.py"
      - "org_agent_mesh/frontend_execution_receipts.py"
      - "org_agent_mesh/frontend_receipt_audit.py"
      - "org_agent_mesh/scheduler_health.py"
      - "org_agent_mesh/scheduler_repair_guard.py"
      - "org_agent_mesh/scheduler_work_gate.py"
      - "org_agent_mesh/scheduler_mutation_ledger.py"
      - "tests/test_internal_scheduler.py"
      - "tests/test_launch_admission.py"
      - "tests/test_schedule_activation.py"
      - "tests/test_scheduler_reconciliation.py"
      - "tests/test_scheduler_policy_coherence.py"
      - "tests/test_frontend_execution_receipts.py"
      - "tests/test_frontend_receipt_audit.py"
      - "tests/test_scheduler_health.py"
      - "tests/test_scheduler_health_policy.py"
      - "tests/test_scheduler_repair_guard.py"
      - "tests/test_scheduler_work_gate.py"
      - "tests/test_scheduler_mutation_ledger.py"
      - "tests/test_scheduler_synchronization.py"
      - "tests/test_scheduler_ecosystem_rollout.py"
      - "schemas/frontend_execution_receipt.schema.json"
      - "schemas/scheduler_frontend_receipt_message.schema.json"
      - "bootstrap/INTERNAL_SCHEDULER_SERVICE.json"
      - "governance/INTERNAL_SPAWN_SCHEDULER_POLICY.json"
      - "governance/INTERNAL_SPAWN_SCHEDULES.json"
      - "governance/SCHEDULER_FRONTEND_BINDINGS.json"
      - "governance/SCHEDULER_FRONTEND_RECEIPT_POLICY.json"
      - "governance/SCHEDULER_HEALTH_POLICY.json"
      - "governance/SCHEDULER_ACTIVATION_GRANT_2026-10-07.json"
      - "governance/SCHEDULER_MUTATION_LEDGER_POLICY.json"
      - "governance/SCHEDULER_MUTATION_LEDGER_V2_2026-10-07.jsonl"
      - "governance/SCHEDULER_SYNCHRONIZATION_DIRECTIVE.json"
      - "protocols/internal_scheduler_service.md"
      - "protocols/scheduled_agent_launch_repair_and_receipt_amendment_2026-10-07.md"
      - ".github/workflows/internal-spawn-scheduler.yml"
      - ".github/workflows/scheduler-dispatch-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scheduler-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scheduler and admission regression suite
        run: |
          python -m unittest -v \
            tests.test_internal_scheduler \
            tests.test_launch_admission \
            tests.test_schedule_activation \
            tests.test_scheduler_reconciliation \
            tests.test_scheduler_policy_coherence \
            tests.test_frontend_execution_receipts \
            tests.test_frontend_receipt_audit \
            tests.test_scheduler_health \
            tests.test_scheduler_health_policy \
            tests.test_scheduler_repair_guard \
            tests.test_scheduler_work_gate \
            tests.test_scheduler_mutation_ledger \
            tests.test_scheduler_synchronization \
            tests.test_scheduler_ecosystem_rollout
