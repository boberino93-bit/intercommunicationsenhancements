name: Internal Spawn Scheduler

on:
  schedule:
    - cron: "0,12,24,36,48 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: internal-spawn-scheduler
  cancel-in-progress: false

jobs:
  scheduler:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate scheduler controls
        run: |
          python -m unittest \
            tests.test_internal_scheduler \
            tests.test_launch_admission \
            tests.test_schedule_activation \
            tests.test_scheduler_reconciliation \
            tests.test_scheduler_policy_coherence \
            tests.test_frontend_execution_receipts \
            tests.test_frontend_receipt_audit \
            tests.test_scheduler_health \
            tests.test_scheduler_health_policy \
            tests.test_scheduler_repair_guard \
            tests.test_scheduler_work_gate \
            tests.test_scheduler_mutation_ledger \
            tests.test_scheduler_synchronization \
            tests.test_scheduler_ecosystem_rollout

      - name: Validate scheduler mutation ledger integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          from org_agent_mesh.scheduler_mutation_ledger import parse_jsonl, validate_ledger

          path = Path("governance/SCHEDULER_MUTATION_LEDGER_V2_2026-10-07.jsonl")
          result = validate_ledger(parse_jsonl(path.read_text(encoding="utf-8")))
          print(
              "scheduler mutation ledger:",
              {"events": result.event_count, "terminal_hash": result.terminal_hash},
          )
          PY

      - name: Evaluate and dispatch due mapped scheduler lanes
        env:
          ORG_AGENT_MESH_SPAWN_ENDPOINT: ${{ secrets.ORG_AGENT_MESH_SPAWN_ENDPOINT }}
          ORG_AGENT_MESH_SPAWN_TOKEN: ${{ secrets.ORG_AGENT_MESH_SPAWN_TOKEN }}
        run: |
          rm -rf scheduler-out
          python -m org_agent_mesh.internal_scheduler \
            --registry governance/INTERNAL_SPAWN_SCHEDULES.json \
            --policy governance/INTERNAL_SPAWN_SCHEDULER_POLICY.json \
            --out-dir scheduler-out \
            --dispatch
          cat scheduler-out/run-summary.json

      - name: Validate dispatch evidence semantics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("scheduler-out/run-summary.json").read_text())
          if summary.get("dispatch_requested") is not True:
              raise SystemExit("scheduler run did not request dispatch")
          for result in summary.get("results", []):
              status = result.get("status")
              receipt = result.get("host_start_receipt")
              if status == "SESSION_STARTED_VERIFIED" and not receipt:
                  raise SystemExit("verified session start is missing host receipt")
              if status != "SESSION_STARTED_VERIFIED" and receipt:
                  raise SystemExit("host receipt present without verified session start")
          print(
              "dispatch evidence:",
              {
                  "due": summary.get("due_ticket_count", 0),
                  "verified": summary.get("verified_start_count", 0),
                  "accepted_unverified": summary.get("dispatch_accepted_start_unverified_count", 0),
                  "adapter_unavailable": summary.get("adapter_unavailable_count", 0),
                  "adapter_rejected": summary.get("adapter_rejected_count", 0),
              },
          )
          PY

      - name: Audit mapped frontend execution receipts
        run: |
          python -m org_agent_mesh.frontend_receipt_audit \
            --bindings governance/SCHEDULER_FRONTEND_BINDINGS.json \
            --receipt-dir agentbus-backup/coordination-messages \
            --out scheduler-out/frontend-receipt-audit.json
          python - <<'PY'
          import json
          from pathlib import Path

          audit = json.loads(Path("scheduler-out/frontend-receipt-audit.json").read_text())
          if audit.get("rejected_receipt_count", 0):
              raise SystemExit("one or more scheduler frontend receipt messages failed verification")
          print(
              "frontend receipt evidence:",
              {
                  "accepted": audit.get("accepted_receipt_count", 0),
                  "rejected": audit.get("rejected_receipt_count", 0),
                  "verified_jobs": sorted(audit.get("latest_verified_by_job", {})),
              },
          )
          PY

      - name: Enforce mapped frontend sustained health
        run: |
          python -m org_agent_mesh.scheduler_health \
            --registry governance/INTERNAL_SPAWN_SCHEDULES.json \
            --bindings governance/SCHEDULER_FRONTEND_BINDINGS.json \
            --receipt-audit scheduler-out/frontend-receipt-audit.json \
            --policy governance/SCHEDULER_HEALTH_POLICY.json \
            --out scheduler-out/frontend-health.json

      - name: Preserve scheduler occurrence audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: internal-spawn-scheduler-${{ github.run_id }}-${{ github.run_attempt }}
          path: scheduler-out/
          if-no-files-found: warn
          retention-days: 30
