name: Build and validate agent deployment packages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run intercommunications hardening tests
        run: python tests/run_all.py

      - name: Build role deployment ZIPs from this commit
        run: python tools/build_agent_packages.py --source-revision "$GITHUB_SHA"

      - name: Verify role deployment ZIPs
        run: python tools/verify_agent_packages.py

      - name: Publish synchronized deployment packages
        uses: actions/upload-artifact@v4
        with:
          name: agent-deployment-packages-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
